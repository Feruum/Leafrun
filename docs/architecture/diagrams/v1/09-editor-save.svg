<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 638.869 724" width="638.869" height="724" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Liberation%20Sans:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Liberation Sans', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="var(--_arrow)" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="base_commit matches">
  <rect x="30" y="198" width="578.869" height="434" rx="0" ry="0" fill="none" stroke="var(--_node-stroke)" stroke-width="1" />
  <rect x="30" y="198" width="150.97" height="18" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="36" y="207" font-size="11" font-weight="600" fill="var(--_text-sec)" dy="3.8499999999999996">alt [base_commit matches]</text>
  <line x1="30" y1="504" x2="608.869" y2="504" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="38" y="518" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">[Another editor changed the branch]</text>
</g>
<line class="lifeline" data-actor="Editor" x1="88.09700000000001" y1="70" x2="88.09700000000001" y2="694" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="API" x1="228.3665" y1="70" x2="228.3665" y2="694" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="DB" x1="374.56399999999996" y1="70" x2="374.56399999999996" y2="694" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Git" x1="533.729" y1="70" x2="533.729" y2="694" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Editor" data-to="API" data-label="Files, base_commit, operation_id" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="88.09700000000001" y1="90" x2="228.3665" y2="90" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="158.23175" y="80" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Files, base_commit, operation_id</text>
</g>
<g class="message" data-from="API" data-to="DB" data-label="Check role, quota, operation" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="228.3665" y1="130" x2="374.56399999999996" y2="130" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="301.46524999999997" y="120" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Check role, quota, operation</text>
</g>
<g class="message" data-from="API" data-to="Git" data-label="Prepare commit + check tip" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="228.3665" y1="170" x2="533.729" y2="170" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="381.04775" y="160" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Prepare commit + check tip</text>
</g>
<g class="message" data-from="Git" data-to="Git" data-label="CAS" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="533.729,238 563.729,238 563.729,258 533.729,258" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="571.729" y="248" font-size="11" text-anchor="start" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">CAS</text>
</g>
<g class="message" data-from="Git" data-to="API" data-label="commit_sha" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="533.729" y1="308" x2="228.3665" y2="308" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="381.04775" y="298" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">commit_sha</text>
</g>
<g class="message" data-from="API" data-to="DB" data-label="Finalize operation, quota and audit" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="228.3665" y1="348" x2="374.56399999999996" y2="348" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="301.46524999999997" y="338" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Finalize operation, quota and audit</text>
</g>
<g class="message" data-from="API" data-to="Editor" data-label="Saved: new SHA" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="228.3665" y1="388" x2="88.09700000000001" y2="388" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="158.23175" y="378" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Saved: new SHA</text>
</g>
<g class="message" data-from="Editor" data-to="API" data-label="Create render for this SHA" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="88.09700000000001" y1="428" x2="228.3665" y2="428" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="158.23175" y="418" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Create render for this SHA</text>
</g>
<g class="message" data-from="API" data-to="Editor" data-label="202, render_id and status" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="228.3665" y1="468" x2="88.09700000000001" y2="468" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="158.23175" y="458" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">202, render_id and status</text>
</g>
<g class="message" data-from="Git" data-to="API" data-label="source_conflict, current_sha" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="533.729" y1="532" x2="228.3665" y2="532" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="381.04775" y="522" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">source_conflict, current_sha</text>
</g>
<g class="message" data-from="API" data-to="DB" data-label="Record conflict + release quota" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="228.3665" y1="572" x2="374.56399999999996" y2="572" stroke="var(--_line)" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="301.46524999999997" y="562" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Record conflict + release quota</text>
</g>
<g class="message" data-from="API" data-to="Editor" data-label="409: compare + retry" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="228.3665" y1="612" x2="88.09700000000001" y2="612" stroke="var(--_line)" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="158.23175" y="602" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">409: compare + retry</text>
</g>
<g class="note" data-position="over" data-actors="API,Git">
  <polygon points="302.88275,620 453.21275,620 459.21275,626 459.21275,643 302.88275,643" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="453.21275,620 459.21275,626 453.21275,626" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="381.04775" y="631.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">Recover using operation_id</text>
</g>
<g class="note" data-position="over" data-actors="Editor,API">
  <polygon points="89.57074999999998,647 220.89275,647 226.89275,653 226.89275,670 89.57074999999998,670" fill="var(--bg)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <polygon points="220.89275,647 226.89275,653 220.89275,653" fill="var(--_inner-stroke)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="158.23174999999998" y="658.5" font-size="11" text-anchor="middle" font-weight="400" fill="var(--_text-muted)" dy="3.8499999999999996">External Git is read-only</text>
</g>
<g class="actor" data-id="Editor" data-label="Web editor" data-type="participant">
  <rect x="40.00000000000001" y="30" width="96.194" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="88.09700000000001" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Web editor</text>
</g>
<g class="actor" data-id="API" data-label="Leafrun API" data-type="participant">
  <rect x="176.19400000000002" y="30" width="104.345" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
