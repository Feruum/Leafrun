</g>
<g class="actor" data-id="DB" data-label="PostgreSQL" data-type="participant">
  <rect x="320.539" y="30" width="108.04999999999998" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="374.56399999999996" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">PostgreSQL</text>
</g>
<g class="actor" data-id="Git" data-label="Git module / Gitea" data-type="participant">
  <rect x="468.58900000000006" y="30" width="130.28000000000003" height="40" rx="4" ry="4" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="533.729" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="var(--_text)" dy="4.55">Git module / Gitea</text>
</g>
</svg>